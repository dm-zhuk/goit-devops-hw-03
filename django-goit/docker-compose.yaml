version: "3.9"

services:
  db:
    image: postgres:15
    container_name: django_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=django_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d django_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  django:
    build:
      context: ./django-goit
    container_name: django_app
    command: gunicorn, --bind, 0.0.0.0:8000, core.wsgi:application
    volumes:
      - .:/app
    environment:
      - DB_NAME=django_db
      - DB_USER=admin
      - DB_PASS=pass
      - DB_HOST=db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - django
      - db

volumes:
  postgres_data:
