apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-app
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
    spec:
      containers:
        # Container 1: Django
        - name: django
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: static-volume
              mountPath: /app/staticfiles
          env:
            - name: DATABASE_URL
              value: "{{ .Values.dbUrl }}"
            - name: SECRET_KEY
              value: "django-insecure-final-project-key"
            - name: DEBUG
              value: "False"
            - name: ALLOWED_HOSTS
              value: "{{ .Values.allowedHosts }}"

        # Container 2: Nginx
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: static-volume
              mountPath: /app/staticfiles

      volumes:
        - name: nginx-config-volume
          configMap:
            name: nginx-config
        - name: static-volume
          emptyDir: {}