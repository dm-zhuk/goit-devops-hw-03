controller:
  admin:
    username: admin
    password: admin123  # ! need to be changed in production

  serviceType: LoadBalancer
  servicePort: 80
  service:
    port: 80
    targetPort: 8080

  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"

  persistentVolume:
    enabled: false  # for simple testing

    # enabled: true
    # storageClass: ""
    # size: 10Gi

  installPlugins:
    - kubernetes:latest
    - workflow-aggregator:latest
    - configuration-as-code:latest
    - credentials-binding:latest
    - git:latest
    - github:latest

